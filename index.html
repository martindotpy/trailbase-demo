<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#000000" />

    <title>Todo | Trailbase Demo</title>

    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/jetbrains-mono.woff2") format("woff2");
        font-display: swap;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;

        font-style: normal;
      }
      @font-face {
        font-family: "JetBrains Mono fallback: Courier New";
        src: local("Courier New");
        font-display: swap;
        font-weight: 100 800;
        font-style: normal;
        size-adjust: 99.9837%;
        ascent-override: 102.0166%;
        descent-override: 30.0049%;
      }
      :root {
        --font-jetbrains-mono:
          "JetBrains Mono", "JetBrains Mono fallback: Courier New", monospace;
      }
    </style>
    <link
      href="/jetbrains-mono.woff2"
      rel="preload"
      as="font"
      crossorigin
      type="font/woff2"
    />
